apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  path: ./roles/master/apps/monitoring
  prune: true
  wait: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: Secret
        name: monitoring-notification-config
  sourceRef:
    kind: GitRepository
    name: flux-system
