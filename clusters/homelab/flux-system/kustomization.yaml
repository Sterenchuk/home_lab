apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - reminder.yaml
  - monitoring.yaml
  - monitoring-config.yaml
  - monitoring-demo.yaml
  - notifications.yaml
  - system-upgrade-controller.yaml
patches:
  - target:
      kind: Kustomization
      name: flux-system
    patch: |
      - op: add
        path: /spec/postBuild
        value:
          substituteFrom:
            - kind: Secret
              name: monitoring-notification-config
              optional: true
