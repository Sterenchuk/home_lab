apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
- reminder.yaml
- monitoring.yaml
- monitoring-demo.yaml
- notifications.yaml
- system-upgrade-controller.yaml
patches:
  - target:
      kind: Kustomization
      name: flux-system
    patch: |
      - op: add
        path: /spec/postBuild
        value:
          substitute:
            quote: '"'
          substituteFrom:
            - kind: Secret
              name: flux-notification-config
