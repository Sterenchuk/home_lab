apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-demo
  namespace: flux-system
spec:
  interval: 10m
  path: ./roles/master/apps/monitoring-demo
  prune: true
  wait: true
  timeout: 3m
  dependsOn:
    - name: monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
