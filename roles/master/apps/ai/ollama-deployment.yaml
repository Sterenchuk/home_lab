apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        kubernetes.io/hostname: l590
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: '30m'
            - name: OLLAMA_MAX_LOADED_MODELS
              value: '1'
            - name: OLLAMA_NUM_PARALLEL
              value: '1'
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          resources:
            requests:
              memory: 4Gi
            limits:
              memory: 10Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-data
