apiVersion: v1
kind: PersistentVolume
metadata:
  name: owncloud-pv
spec:
  capacity:
    storage: 200Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nas-nfs
  mountOptions:
    - nfsvers=4.1
    - hard
  nfs:
    server: 100.99.212.60
    path: /mnt/nas/owncloud-docs

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name: owncloud-data
  namespace: owncloud
spec: 
  accessModes: [ReadWriteOnce]
  storageClassName: nas-nfs
  volumeName: owncloud-pv
  resources:
    requests:
      storage: 200Gi
