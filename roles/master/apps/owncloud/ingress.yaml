apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: owncloud
  namespace: owncloud
spec:
  ingressClassName: traefik
  rules:
    - host: owncloud.sansesdevelopment.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: owncloud
                port:
                  number: 80
