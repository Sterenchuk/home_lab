apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-apache-mpm
  namespace: nextcloud
data:
  mpm_prefork.conf: |
    <IfModule mpm_prefork_module>
        StartServers             5
        MinSpareServers          5
        MaxSpareServers         10
        ServerLimit            200
        MaxRequestWorkers      200
        MaxConnectionsPerChild   0
    </IfModule>
