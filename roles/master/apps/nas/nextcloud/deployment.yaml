apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      nodeSelector:
        kubernetes.io/hostname: zotac
      containers:
        - name: nextcloud
          image: nextcloud:32-apache # pin a major version; use the current stable major
          ports:
            - containerPort: 80
          env:
            - name: POSTGRES_HOST
              value: postgres.database.svc.cluster.local
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: nextcloud-secret, key: POSTGRES_PASSWORD }
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  { name: nextcloud-secret, key: NEXTCLOUD_ADMIN_USER }
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  { name: nextcloud-secret, key: NEXTCLOUD_ADMIN_PASSWORD }
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: 'nextcloud.sansesdevelopment.uk 100.99.212.60'
            - name: OVERWRITEPROTOCOL
              value: https
            - name: TRUSTED_PROXIES
              value: 10.42.0.0/16
          volumeMounts:
            - name: html
              mountPath: /var/www/html
            - name: data
              mountPath: /var/www/html/data
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: nextcloud.sansesdevelopment.uk
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data
        - name: html
          persistentVolumeClaim:
            claimName: nextcloud-html
