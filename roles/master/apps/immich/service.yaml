apiVersion: v1
kind: Service

metadata:
  name: immich-server
  namespace: immich

spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: 2283
      protocol: TCP
  selector:
    app: immich-server

---
apiVersion: v1
kind: Service

metadata:
  name: immich-postgres
  namespace: immich

spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: immich-postgres

---
apiVersion: v1
kind: Service

metadata:
  name: immich-redis
  namespace: immich

spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: immich-redis
