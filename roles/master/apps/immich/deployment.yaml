apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: macbook
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:release
          ports:
            - containerPort: 3001
          env:
            - name: DB_HOSTNAME
              value: 'immich-postgres'
            - name: DB_USERNAME
              value: 'postgres'
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
            - name: DB_DATABASE_NAME
              value: 'immich'
            - name: REDIS_HOSTNAME
              value: 'immich-redis'
          volumeMounts:
            - mountPath: /usr/src/app/upload
              name: immich-photos
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 4Gi
      volumes:
        - name: immich-photos
          persistentVolumeClaim:
            claimName: immich-photos-pvc
