apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-media-pv
spec:
  capacity:
    storage: 600Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nas-nfs-immich
  mountOptions:
    - nfsvers=4.1
    - hard
  nfs:
    server: 100.99.212.60
    path: /mnt/nas/immich-photos
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-photos-pvc
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nas-nfs-immich
  volumeName: immich-media-pv
  resources:
    requests:
      storage: 600Gi
